<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<base href="../assets/">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; script-src 'self'; style-src 'unsafe-inline'">
<title>熊寶桌寵</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  /* 熊寶四周留 48 點空白：被甩動傾斜時身體不會被切掉；#rig 以抓取點為中心旋轉 */
  #rig { position: absolute; left: 48px; top: 48px; width: 192px; height: 192px; transform-origin: 96px 38px; will-change: transform; }
  #stage { position: absolute; left: 0; top: 0; width: 384px; height: 384px; transform-origin: 0 0; transform: scale(0.5); transition: opacity 1.5s; }
  #stage img { position: absolute; left: 0; top: 0; width: 384px; height: 384px; -webkit-user-drag: none; pointer-events: none; }
  #stage img.mirror { transform: scaleX(-1); }
  #bubble { position: absolute; left: 50%; top: 51px; transform: translateX(-50%) translateY(4px); max-width: 184px; box-sizing: border-box;
    padding: 4px 10px; border-radius: 10px; background: #fffaf2; border: 1.5px solid #876c4b; color: #573d2a;
    font: bold 13px/1.25 "Microsoft JhengHei UI", "Microsoft JhengHei", system-ui, sans-serif; white-space: nowrap;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -5px; border: 5px solid transparent; border-top-color: #876c4b; border-bottom: 0; }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* 游標：碰到熊寶時張開的熊掌、抓起來時合掌（熱點照素材 manifest 的 hotspot_32_px） */
  body.hit { cursor: url('bear-paw-open-32.png') 16 15, grab; }
  body.dragging { cursor: url('bear-paw-grab-32.png') 16 4, grabbing; }
</style>
</head>
<body>
<div id="rig"><div id="stage"></div></div>
<div id="bubble"></div>
<script src="pack/pet-effects.js"></script>
<script src="../src/pet.js"></script>
</body>
</html>
