name: 電腦版建置

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 建置安裝程式
        working-directory: desktop
        shell: bash
        run: |
          cp ../icons/icon-512.png icon.png
          npm install --no-audit --no-fund
          npm run dist

      - name: 發布到 Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete desktop-build --yes --cleanup-tag || true
          gh release create desktop-build desktop/dist/bearbao-setup.exe --title "電腦版安裝程式" --notes "自動建置：${GITHUB_SHA}" --prerelease
